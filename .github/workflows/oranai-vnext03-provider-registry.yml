name: ORAN AI - Provider Registry vNext03
on:
  push:
    branches: [oranai-next-multisource-staging]
    paths:
      - provider_registry_vnext03.json
      - provider_contract.py
      - tests/test_provider_registry_vnext03.py
      - .github/workflows/oranai-vnext03-provider-registry.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oranai-vnext03-registry
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed source registry policy
        run: python provider_contract.py
      - name: Provider registry tests
        run: python -m unittest discover -s tests -p 'test_provider_registry_vnext03.py' -v
      - name: Previous collector staging regression
        run: |
          python -m unittest discover -s tests -p 'test_oranai_vnext_stager.py' -v
          python -m unittest discover -s tests -p 'test_statsbomb_research.py' -v
      - name: Persist scope report (temporary, never database)
        run: python provider_contract.py > provider_registry_acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: oranai-registry-vnext03-acceptance
          path: provider_registry_acceptance.json
          if-no-files-found: error
          retention-days: 30
