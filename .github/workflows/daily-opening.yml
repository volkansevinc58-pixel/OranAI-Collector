name: OranAI Daily Opening

on:
  workflow_dispatch:
  schedule:
    - cron: "59 20 * * *"

permissions:
  contents: write

concurrency:
  group: oranai-repo-writer
  cancel-in-progress: false

jobs:
  opening:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Europe/Istanbul

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Turkiye saatini kontrol et
        run: |
          echo "TZ=$TZ"
          date
          python -c "from datetime import datetime; print('Python saati:', datetime.now())"

      - name: Gunluk acilis snapshot olustur
        run: python daily_opening.py

      - name: Acilis snapshot kaydet
        run: |
          git config user.name "OranAI Bot"
          git config user.email "actions@github.com"

          git add -f oranai_*_ACILIS.csv

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni acilis snapshot yok."
            exit 0
          fi

          git commit -m "Daily opening snapshot"
          git push



