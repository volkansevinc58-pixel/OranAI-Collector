name: OranAI Daily Results

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # 08:00 Turkiye - ana cekim
    - cron: "0 9 * * *"  # 12:00 Turkiye - retry
    - cron: "0 15 * * *" # 18:00 Turkiye - retry

permissions:
  contents: write

concurrency:
  group: oranai-repo-writer
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Europe/Istanbul

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Turkiye saatini kontrol et
        run: |
          echo "TZ=$TZ"
          date
          python -c "from datetime import datetime; print('Python saati:', datetime.now())"

      - name: Gunluk sonuclari cek
        run: python daily_results.py

      - name: Guvenli sonucu kaydet
        run: |
          git config user.name "OranAI Bot"
          git config user.email "actions@github.com"

          shopt -s nullglob
          files=(oranai_*_SONUC_GUVENLI.csv)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Guvenli sonuc dosyasi olusmadi. Kaydedilecek dosya yok."
            exit 0
          fi

          git add -f "${files[@]}"

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni sonuc yok."
            exit 0
          fi

          git commit -m "Daily results update"
          for attempt in 1 2 3; do
            echo "Push denemesi: $attempt/3"

            if git push origin HEAD:main; then
              echo "Push basarili."
              exit 0
            fi

            echo "Push basarisiz. Remote guncellenip tekrar denenecek."
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase basarisiz. Otomatik islem durduruldu."
              git rebase --abort || true
              exit 1
            fi

            sleep 10
          done

          echo "3 push denemesi de basarisiz."
          exit 1