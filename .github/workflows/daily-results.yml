name: OranAI Daily Results

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: oranai-repo-writer
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Europe/Istanbul

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Turkiye saatini kontrol et
        run: |
          echo "TZ=$TZ"
          date
          python -c "from datetime import datetime; print('Python saati:', datetime.now())"

      - name: Gunluk sonuclari cek
        run: python daily_results.py

      - name: Guvenli sonucu kaydet
        run: |
          git config user.name "OranAI Bot"
          git config user.email "actions@github.com"

          git add -f oranai_*_SONUC_GUVENLI.csv

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni sonuc yok."
            exit 0
          fi

          git commit -m "Daily results update"
          git push



