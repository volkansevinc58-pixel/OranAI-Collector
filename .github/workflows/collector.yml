name: OranAI Cloud Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: oranai-repo-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4

    env:
      TZ: Europe/Istanbul

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Saat dilimini kontrol et
        run: |
          echo "TZ=$TZ"
          date
          python -c "from datetime import datetime; print('Python saati:', datetime.now())"

      - name: Collector calistir
        run: python collector_canli.py

      - name: Verileri kaydet
        run: |
          git config user.name "OranAI Bot"
          git config user.email "actions@github.com"

          git add -f collector_canli_master.csv
          git add -f collector_canli_prematch.csv

          if git diff --cached --quiet; then
            echo "Yeni veri yok."
            exit 0
          fi

          git commit -m "Cloud collector update"
          git push
